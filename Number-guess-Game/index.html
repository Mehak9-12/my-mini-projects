<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="stylesheet" href="../Number-guess-Game/style.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>Guess the Number</h1>
      <p id="message">Please select the level to get started</p>
      <input type="number" id="guess" min="1" />
      <br />
      <button id="checkBtn">Check</button>
      <button id="easy" onclick="setDifficulty('easy')">Easy</button>
      <button id="hard" onclick="setDifficulty('hard')">Hard</button>
      <button id="reset" onclick="reset()">Reset</button>
      <p id="attempts">Attempts: 0</p>
    </div>
    <script src="../Number-guess-Game/numberguess.js"></script>
  </body>
</html>
