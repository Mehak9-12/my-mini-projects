<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Roll Game</title>
    <style>
      body {
        font-family: 'Poppins', Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      }

      .game-box {
        background: #fff;
        padding: 40px 50px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
        width: 320px;
        animation: fadeIn 1s ease;
      }

      h1 {
        margin-bottom: 25px;
        font-size: 1.8rem;
        color: #333;
      }

      button {
        font-size: 1rem;
        font-weight: 600;
        padding: 12px 20px;
        margin: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      #click {
        background: #4caf50;
        color: white;
      }
      #click:hover {
        background: #45a049;
        transform: scale(1.05);
      }

      #reset {
        background: #f44336;
        color: white;
      }
      #reset:hover {
        background: #d32f2f;
        transform: scale(1.05);
      }

      #dnumber {
        font-size: 1.6rem;
        margin-top: 25px;
        font-weight: bold;
        color: #222;
      }

      #result {
        font-size: 1.2rem;
        margin-top: 10px;
        color: #555;
      }
    </style>
  </head>

  <body>
    <div class="game-box">
      <h1>🎲 Dice Roll Game 🎲</h1>
      <button id="click" onclick="rollDice()">Play</button>
      <button id="reset" onclick="resetDice()">Reset</button>
      <p id="dnumber"></p>
      <p id="result"></p>
    </div>
    <script src="../dice-roll-game/diceroll.js"></script>
  </body>
</html>
