<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #483d8b;
      }
      button {
        padding: 10px 40px;
        border-radius: 5px;
        font-size: 20px;
        border: 1px solid black;
        box-shadow: 0px 0px 14px 9px #c2b8b8;
        animation: glow 3s ease-in-out infinite;
        transition: all 0.3s ease;
      }
      @keyframes glow {
        0% {
          box-shadow: 0px 0px 14px 9px #c2b8b8;
        }
        50% {
          box-shadow: 0 0 10px 3px #7266b3;
        }
        100% {
          box-shadow: 0px 0px 14px 9px #c2b8b8;
        }
      }
    </style>
  </head>
  <body>
    <button type="submit">Click Me</button>
  </body>
</html>
