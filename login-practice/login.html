<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../login-practice/login.css" />
  </head>
  <body>
    <form class="form-container">
      <label for="name">Name</label>
      <input
        type="text"
        name="name"
        id="name"
        placeholder="Enter your username"
        required
      />
      <label for="pwd">Password</label>
      <input
        type="password"
        name="pwd"
        id="pwd"
        placeholder="*******"
        required
      />
      <label
        ><input type="checkbox" id="check" onclick="myFunction()" />Show
        Password
      </label>

      <button id="login">Login</button>
    </form>
    <div id="welcomePage" class="hidden">
      <p id="welcomeMessage"></p>
      <button id="logout">Logout</button>
    </div>
    <script src="../login-practice/login.js"></script>
  </body>
</html>
